# Cloudflare Worker for Secondwind (the only backend).
#   POST /translate  defect description (any language) -> short German sentence (Workers AI)
#   POST /company    a company's postal address, read from its own Impressum page
# Deploy: Cloudflare dashboard > Workers & Pages > secondwind (connected to GitHub, root directory "worker").
# No database, no logs. Nothing the user types is stored.
# Optional secret (dashboard > secondwind > Settings > Variables and Secrets): GROQ_API_KEY
#   -> lets the company lookup search the web. Without it, the Worker uses Wikidata or the website the user pastes.

name = "secondwind"
main = "src/index.js"
compatibility_date = "2026-11-15"
workers_dev = true

# Workers AI (free daily allowance; on the Free plan it stops instead of charging)
[ai]
binding = "AI"

# Abuse protection (the visitor's IP is hashed; counters are kept by Cloudflare, not by us)
[[ratelimits]]
name = "RATE_LIMITER"      # translation: 5 per minute
namespace_id = "2611"
  [ratelimits.simple]
  limit = 5
  period = 60

[[ratelimits]]
name = "LOOKUP_LIMITER"    # company lookup: 3 per minute
namespace_id = "2613"
  [ratelimits.simple]
  limit = 3
  period = 60

[vars]
# Only this website may use the backend
ALLOWED_ORIGINS = "https://dhanush-satish-reddy.github.io"

# Logging off: we never want anything the user types in any log
[observability]
enabled = false
